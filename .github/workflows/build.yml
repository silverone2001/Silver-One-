name: Build Silver One APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: false

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find . -name pubspec.yaml -not -path './.git/*' -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Fix Kotlin Gradle jvmTarget
        run: |
          python3 - <<'PY'
          import os
          import re

          root = os.environ["PROJECT_DIR"]

          for dirpath, _, files in os.walk(root):
              for name in files:
                  if not name.endswith((".gradle", ".gradle.kts")):
                      continue

                  path = os.path.join(dirpath, name)

                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()

                      original = text

                      # Remove the incompatible Kotlin jvmTarget assignment
                      text = re.sub(
                          r'(?m)^[ \t]*jvmTarget[ \t]*=[ \t]*\r?\n?[ \t]*org\.jetbrains\.kotlin\.gradle\.dsl\.JvmTarget\.JVM_17[ \t]*\r?\n?',
                          '',
                          text
                      )

                      if text != original:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(text)
                          print("Fixed:", path)

                  except Exception as e:
                      print("Skipped:", path, e)
          PY

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Silver-One-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
