name: Build Silver One APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: false

      - name: Find or extract Flutter project
        shell: bash
        run: |
          set -e

          echo "Searching for Flutter project..."

          PROJECT_DIR=""

          # First search directly
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              PROJECT_DIR="$(dirname "$file")"
              break
            fi
          done < <(find . -name pubspec.yaml -not -path './.git/*' -print)

          # If not found, search ZIP files and extract them
          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found directly."
            echo "Searching for ZIP..."

            ZIP_FILE=""

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                ZIP_FILE="$file"
                break
              fi
            done < <(find . -maxdepth 3 -type f -iname "*.zip" -not -path './.git/*' -print)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Flutter project or ZIP file found."
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                PROJECT_DIR="$(dirname "$file")"
                break
              fi
            done < <(find extracted -name pubspec.yaml -not -path '*/.git/*' -print)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin Gradle jvmTarget
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          root = os.environ["PROJECT_DIR"]

          for dirpath, _, files in os.walk(root):
              for name in files:
                  if not name.endswith((".gradle", ".gradle.kts")):
                      continue

                  path = os.path.join(dirpath, name)

                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()

                      original = text

                      text = re.sub(
                          r'(?m)^[ \t]*jvmTarget[ \t]*=[ \t]*org\.jetbrains\.kotlin\.gradle\.dsl\.JvmTarget\.JVM_17[ \t]*$',
                          '',
                          text
                      )

                      if text != original:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(text)
                          print("Fixed:", path)

                  except Exception as e:
                      print("Skipped:", path, e)
          PY

      - name: Get dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Silver-One-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
