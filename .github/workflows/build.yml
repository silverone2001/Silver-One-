name: Build Silver One APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Unzip project
        run: |
          unzip -o SilverOne_Native_Real.zip -d silver_one
          echo "Searching for Flutter project..."
          find silver_one -name pubspec.yaml -print

      - name: Get dependencies
        run: |
          PROJECT_DIR=$(dirname "$(find silver_one -name pubspec.yaml -print -quit)")
          echo "Project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find silver_one -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silver-one-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
